<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Interativo</title>
    <!-- Importação da fonte Plus Jakarta Sans -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        /* Estilos base e resets */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            padding: 40px 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        /* Navegação por Abas */
        .nav-tabs {
            display: flex;
            gap: 20px;
            border-bottom: 2px solid #e2e8f0;
            margin-bottom: 30px;
        }

        .tab-btn {
            background: none;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            color: #64748b;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
        }

        .tab-btn.active {
            color: #0284c7;
            border-bottom: 3px solid #0284c7;
            font-weight: 700;
        }

        /* Efeitos Glow do usuário */
        .glow-blue { box-shadow: 0 0 25px rgba(59, 130, 246, 0.35); }
        .glow-red { box-shadow: 0 0 25px rgba(239, 68, 68, 0.35); }
        .glow-amber { box-shadow: 0 0 25px rgba(245, 158, 11, 0.35); }
        .glow-purple { box-shadow: 0 0 25px rgba(168, 85, 247, 0.35); }

        /* Transições de página */
        .page-transition {
            transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out;
        }

        .page-content {
            display: none;
            opacity: 0;
            transform: translateY(10px);
        }

        .page-content.active {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        /* Grid de Certificações */
        .grid-certificados {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .card-certificado {
            background: white;
            padding: 24px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
        }

        /* Mídia (Vídeo e Infográfico) */
        .media-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-top: 30px;
        }

        @media (max-width: 768px) {
            .media-section { grid-template-columns: 1fr; }
        }

        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* Proporção 16:9 */
            height: 0;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .infografico-box {
            background: #fff;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 250px;
            border: 2px dashed #cbd5e1;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Menu de Navegação -->
    <nav class="nav-tabs">
        <button class="tab-btn active" onclick="switchPage('principal')">Início</button>
        <button class="tab-btn" onclick="switchPage('certificacoes')">Certificações & Mídia</button>
    </nav>

    <!-- PÁGINA 1: CONTEÚDO PRINCIPAL -->
    <section id="principal" class="page-content page-transition active">
        <h1>Página Principal</h1>
        <p style="margin-top: 15px; color: #64748b;">Este é o espaço para o seu conteúdo inicial.</p>
    </section>

    <!-- PÁGINA 2: CERTIFICAÇÕES, VÍDEO E INFOGRÁFICO -->
    <section id="certificacoes" class="page-content page-transition">
        <h2 style="margin-bottom: 25px;">Certificações e Recursos Visuais</h2>
        
        <!-- Blocos de Certificados usando seus efeitos Glow -->
        <div class="grid-certificados">
            <div class="card-certificado glow-blue">
                <h3>Certificação Cloud</h3>
                <p style="color: #64748b; margin-top: 8px;">Emitido por Tech Academy • 2026</p>
            </div>
            <div class="card-certificado glow-purple">
                <h3>UX/UI Design Expert</h3>
                <p style="color: #64748b; margin-top: 8px;">Emitido por Design Institute • 2026</p>
            </div>
        </div>

        <!-- Seção de Mídia Multi-coluna -->
        <div class="media-section">
            <!-- Espaço do Vídeo -->
            <div>
                <h4 style="margin-bottom: 12px;">Vídeo Demonstrativo</h4>
                <div class="video-container glow-amber">
                    <!-- Substitua o URL do src pelo link do seu vídeo do YouTube/Vimeo -->
                    <iframe src="https://youtube.com" allowfullscreen></iframe>
                </div>
            </div>

            <!-- Espaço do Infográfico -->
            <div>
                <h4 style="margin-bottom: 12px;">Infográfico Analítico</h4>
                <div class="infografico-box glow-red">
                    <!-- Substitua esta tag p pela sua imagem <img src="infografico.png" alt="Infográfico"> -->
                    <p style="color: #94a3b8; font-weight: 500;">[ Insira sua imagem de infográfico aqui ]</p>
                </div>
            </div>
        </div>
    </section>
</div>

<script>
    // Função para alternar entre as abas/páginas com suavidade
    function switchPage(pageId) {
        // Remove classe ativa de todas as páginas e botões
        document.querySelectorAll('.page-content').forEach(page => page.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));

        // Ativa a página correspondente
        const activePage = document.getElementById(pageId);
        activePage.classList.add('active');

        // Ativa o botão correto da barra de navegação
        const clickedBtn = Array.from(document.querySelectorAll('.tab-btn'))
            .find(btn => btn.getAttribute('onclick').includes(pageId));
        if (clickedBtn) clickedBtn.classList.add('active');
    }
</script>

</body>
</html>
